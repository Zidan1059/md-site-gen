[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md-site-gen"
version = "0.1.0"
description = "A lightweight static site generator converting Markdown to HTML."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "markdown>=3.5",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.scripts]
sitegen = "sitegen.cli:main"
